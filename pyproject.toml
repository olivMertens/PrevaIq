[project]
name = "workbenchiq"
version = "0.3.0"
description = "WorkbenchIQ - AI-powered document processing workbench for insurance underwriting, claims and mortgage, with FastAPI backend and Next.js frontend."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "azure-identity>=1.19.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "azure-storage-blob>=12.27.1",
    "filelock>=3.16.0",
    "gunicorn>=21.0.0",
    "asyncpg>=0.31.0",
    "tiktoken>=0.12.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "pgvector>=0.2.4",
    "numpy>=1.24.0",
    "xarray>=2025.1.0",
    "h5netcdf>=1.4.1",
    "pymupdf>=1.25.0",
    "agent-framework-core>=1.24.0,<2.0",
    "agent-framework-openai>=1.18.0,<2.0",
    # Required by MCPStreamableHTTPTool (Microsoft Web IQ); MAF 1.24 uses the MCP v2 client API.
    "mcp>=2.2.0,<3.0",
    # Required by MAF MCP tools to recover MCP sessions (same bounds as agent-framework-core[all]).
    "tenacity>=9.1.4,<9.2.0",
    "azure-monitor-opentelemetry>=1.6.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-instrumentation-openai-v2>=2.0.0",
    "azure-ai-projects>=1.0.0",
    "azure-ai-contentunderstanding>=1.2.0b1",
    "markitdown[az-content-understanding]>=0.1.6",
    # Reads C2PA Content Credentials embedded in claim photos (provenance badge).
    # 0.38.0 is the latest release with Linux x86_64 and Windows wheels.
    "c2pa-python==0.38.0",
    "h5py>=3.12.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest>=7.4.0",
]

[project.scripts]
api-server = "api_server:main"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "integration: needs live services (PostgreSQL/pgvector, Azure OpenAI); skipped unless RUN_INTEGRATION_TESTS=1",
]
