imit="10" pointer-events="stroke" style="stroke: rgb(23, 57, 92);" /><ns0:path d="M 1630 537.76 L 1626 529.76 L 1634 529.76 Z" fill="#17395c" stroke="#17395c" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(23, 57, 92); stroke: rgb(23, 57, 92);" /></ns0:g></ns0:g></ns0:g></ns0:g></ns0:g></ns0:svg>