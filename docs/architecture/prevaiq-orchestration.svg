<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" version="1.1" width="1850px" height="930px" viewBox="0 0 1850 930"><ns0:defs /><ns0:rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);" /><ns0:g><ns0:g data-cell-id="0"><ns0:g data-cell-id="1"><ns0:g data-cell-id="text1"><ns0:g><ns0:rect x="60" y="35" width="1720" height="48" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="30px" style="fill: rgb(23, 57, 92);"><ns0:text x="60" y="73">PrevaIQ - controlled document and analysis pipeline</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="subtitle"><ns0:g><ns0:rect x="60" y="95" width="1720" height="30" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 57, 92);"><ns0:text x="60" y="117">Finite stages, explicit fallback provenance, human accountability and preserved decisions / weather</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="budget"><ns0:g><ns0:rect x="340" y="165" width="1080" height="585" fill="none" stroke="#007d76" stroke-width="2" stroke-dasharray="12 8" pointer-events="all" style="stroke: rgb(0, 125, 118);" /></ns0:g></ns0:g><ns0:g data-cell-id="budget-label"><ns0:g><ns0:rect x="360" y="177" width="1040" height="28" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(23, 57, 92);"><ns0:text x="360" y="198">Controlled execution - StageBudget: wall-clock time / analysis tokens / re-extractions</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="box2"><ns0:g><ns0:rect x="60" y="220" width="210" height="200" fill="#eaf3fc" stroke="#17395c" stroke-width="1.5" pointer-events="all" style="fill: rgb(234, 243, 252); stroke: rgb(23, 57, 92);" /></ns0:g><ns0:g data-cell-id="upload-title"><ns0:g><ns0:rect x="76" y="236" width="178" height="30" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(23, 57, 92);"><ns0:text x="76" y="259">Upload / case</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="upload-body"><ns0:g><ns0:rect x="76" y="278" width="178" height="120" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="14px" style="fill: rgb(23, 57, 92);"><ns0:text x="76" y="318.5">PDF / office files</ns0:text><ns0:text x="76" y="335.5">Photos / media</ns0:text><ns0:text x="76" y="352.5">Persona + original language</ns0:text><ns0:text x="76" y="369.5">Source files retained</ns0:text></ns0:g></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="box3"><ns0:g><ns0:rect x="370" y="220" width="290" height="200" fill="#e6f5ee" stroke="#17395c" stroke-width="1.5" pointer-events="all" style="fill: rgb(230, 245, 238); stroke: rgb(23, 57, 92);" /></ns0:g><ns0:g data-cell-id="extraction-title"><ns0:g><ns0:rect x="386" y="236" width="258" height="30" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(23, 57, 92);"><ns0:text x="386" y="259">Routed extraction</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="extraction-body"><ns0:g><ns0:rect x="386" y="278" width="258" height="126" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="14px" style="fill: rgb(23, 57, 92);"><ns0:text x="386" y="304.5">CU with a usable analyzer</ns0:text><ns0:text x="386" y="321.5">Local MarkItDown for office files</ns0:text><ns0:text x="386" y="338.5">PDF: layout + LLM field fallback</ns0:text><ns0:text x="386" y="355.5">Image: GPT vision fallback</ns0:text><ns0:text x="386" y="372.5">Non-retryable 4xx fail fast</ns0:text><ns0:text x="386" y="389.5">Per-file backend / source provenance</ns0:text></ns0:g></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="box4"><ns0:g><ns0:rect x="760" y="220" width="250" height="200" fill="#e6f5ee" stroke="#17395c" stroke-width="1.5" pointer-events="all" style="fill: rgb(230, 245, 238); stroke: rgb(23, 57, 92);" /></ns0:g><ns0:g data-cell-id="validation-title"><ns0:g><ns0:rect x="776" y="236" width="218" height="30" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(23, 57, 92);"><ns0:text x="776" y="259">Validate / flag</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="validation-body"><ns0:g><ns0:rect x="776" y="278" width="218" height="126" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="14px" style="fill: rgb(23, 57, 92);"><ns0:text x="776" y="313">Quality + confidence checks</ns0:text><ns0:text x="776" y="330">Flag LLM-inferred fields</ns0:text><ns0:text x="776" y="347">Composite-document review</ns0:text><ns0:text x="776" y="364">Record budget exhaustion</ns0:text><ns0:text x="776" y="381">No invented field confidence</ns0:text></ns0:g></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="box5"><ns0:g><ns0:rect x="1110" y="220" width="270" height="200" fill="#eeeaf8" stroke="#17395c" stroke-width="1.5" pointer-events="all" style="fill: rgb(238, 234, 248); stroke: rgb(23, 57, 92);" /></ns0:g><ns0:g data-cell-id="analysis-title"><ns0:g><ns0:rect x="1126" y="236" width="238" height="30" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(23, 57, 92);"><ns0:text x="1126" y="259">Bounded analysis</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="analysis-body"><ns0:g><ns0:rect x="1126" y="278" width="238" height="126" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="14px" style="fill: rgb(23, 57, 92);"><ns0:text x="1126" y="304.5">Executable prompt steps only</ns0:text><ns0:text x="1126" y="321.5">Exclude system / metadata entries</ns0:text><ns0:text x="1126" y="338.5">Independent branches in parallel</ns0:text><ns0:text x="1126" y="355.5">Policy search + source citations</ns0:text><ns0:text x="1126" y="372.5">Validate analysis / flag failures</ns0:text><ns0:text x="1126" y="389.5">No open-ended agent loop</ns0:text></ns0:g></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="box6"><ns0:g><ns0:rect x="1480" y="220" width="300" height="200" fill="#fff4dc" stroke="#17395c" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 244, 220); stroke: rgb(23, 57, 92);" /></ns0:g><ns0:g data-cell-id="review-title"><ns0:g><ns0:rect x="1496" y="236" width="268" height="30" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(23, 57, 92);"><ns0:text x="1496" y="259">Human review / decision</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="review-body"><ns0:g><ns0:rect x="1496" y="278" width="268" height="126" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="14px" style="fill: rgb(23, 57, 92);"><ns0:text x="1496" y="313">Review reasons + stage trace</ns0:text><ns0:text x="1496" y="330">needs_review / auto_ok</ns0:text><ns0:text x="1496" y="347">Handler records a decision</ns0:text><ns0:text x="1496" y="364">reviewed + justification / audit</ns0:text><ns0:text x="1496" y="381">AI signals remain advisory</ns0:text></ns0:g></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="box7"><ns0:g><ns0:rect x="370" y="540" width="290" height="170" fill="#fff0e6" stroke="#b66522" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 240, 230); stroke: rgb(182, 101, 34);" /></ns0:g><ns0:g data-cell-id="retry-title"><ns0:g><ns0:rect x="386" y="556" width="258" height="30" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(23, 57, 92);"><ns0:text x="386" y="579">Targeted re-extraction</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="retry-body"><ns0:g><ns0:rect x="386" y="598" width="258" height="96" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="14px" style="fill: rgb(23, 57, 92);"><ns0:text x="386" y="626.5">Optional Mistral Document AI</ns0:text><ns0:text x="386" y="643.5">At most once per file</ns0:text><ns0:text x="386" y="660.5">Keep the better extraction</ns0:text><ns0:text x="386" y="677.5">Skip if disabled / budget spent</ns0:text></ns0:g></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="retry-condition"><ns0:g><ns0:rect x="300" y="455" width="190" height="45" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#B66522" font-family="Arial" text-anchor="end" font-size="14px" style="fill: rgb(182, 101, 34);"><ns0:text x="490" y="475">Weak PDF only</ns0:text><ns0:text x="490" y="492">Budget available</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="telemetry"><ns0:g><ns0:rect x="1110" y="540" width="270" height="170" fill="#eaf3fc" stroke="#17395c" stroke-width="1.5" pointer-events="all" style="fill: rgb(234, 243, 252); stroke: rgb(23, 57, 92);" /></ns0:g><ns0:g data-cell-id="telemetry-title"><ns0:g><ns0:rect x="1126" y="556" width="238" height="30" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(23, 57, 92);"><ns0:text x="1126" y="579">Observable failures</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="telemetry-body"><ns0:g><ns0:rect x="1126" y="598" width="238" height="96" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="14px" style="fill: rgb(23, 57, 92);"><ns0:text x="1126" y="626.5">Incoming HTTP + stage spans</ns0:text><ns0:text x="1126" y="643.5">Aggregated failed-step warning</ns0:text><ns0:text x="1126" y="660.5">HTTP 5xx / analysis-failure alerts</ns0:text><ns0:text x="1126" y="677.5">Optional email recipient</ns0:text></ns0:g></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="saved"><ns0:g><ns0:rect x="1480" y="540" width="300" height="170" fill="#fff4dc" stroke="#17395c" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 244, 220); stroke: rgb(23, 57, 92);" /></ns0:g><ns0:g data-cell-id="saved-title"><ns0:g><ns0:rect x="1496" y="556" width="268" height="30" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(23, 57, 92);"><ns0:text x="1496" y="579">Saved dossier metadata</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="saved-body"><ns0:g><ns0:rect x="1496" y="598" width="268" height="96" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="14px" style="fill: rgb(23, 57, 92);"><ns0:text x="1496" y="626.5">decision + human audit</ns0:text><ns0:text x="1496" y="643.5">aurora: real weather evidence</ns0:text><ns0:text x="1496" y="660.5">aurora_demo: synthetic only</ns0:text><ns0:text x="1496" y="677.5">Preserved on full re-analysis</ns0:text></ns0:g></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="limits"><ns0:g><ns0:rect x="60" y="795" width="1720" height="36" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 57, 92);"><ns0:text x="60" y="820">Budget exhaustion and invalid outputs are review conditions, not silent success. Jobs and progress remain process-local; there is no durable distributed queue.</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="locale-note"><ns0:g><ns0:rect x="60" y="850" width="1720" height="36" fill="none" stroke="none" pointer-events="all" /></ns0:g><ns0:g><ns0:g fill="#17395C" font-family="Arial" text-anchor="start" font-size="16px" style="fill: rgb(23, 57, 92);"><ns0:text x="60" y="875">Translated analysis is a separate projection. Source documents and OCR remain in their original language. Weather reads do not trigger inference.</ns0:text></ns0:g></ns0:g></ns0:g><ns0:g data-cell-id="edge1"><ns0:g><ns0:path d="M 270 320 L 359.76 320" fill="none" stroke="#17395c" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(23, 57, 92);" /><ns0:path d="M 367.76 320 L 359.76 324 L 359.76 316 Z" fill="#17395c" stroke="#17395c" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(23, 57, 92); stroke: rgb(23, 57, 92);" /></ns0:g></ns0:g><ns0:g data-cell-id="edge2"><ns0:g><ns0:path d="M 660 320 L 749.76 320" fill="none" stroke="#17395c" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(23, 57, 92);" /><ns0:path d="M 757.76 320 L 749.76 324 L 749.76 316 Z" fill="#17395c" stroke="#17395c" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(23, 57, 92); stroke: rgb(23, 57, 92);" /></ns0:g></ns0:g><ns0:g data-cell-id="edge3"><ns0:g><ns0:path d="M 1010 320 L 1099.76 320" fill="none" stroke="#17395c" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(23, 57, 92);" /><ns0:path d="M 1107.76 320 L 1099.76 324 L 1099.76 316 Z" fill="#17395c" stroke="#17395c" stroke-width="2" stroke-miterlimit=