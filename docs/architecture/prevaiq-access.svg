<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470"><rect width="100%" height="100%" fill="#FFFFFF" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17395C" /></marker></defs><g id="title" transform="translate(35.0 20.0)"><text x="12" y="25.0" font-size="22.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="bold">PrevaIQ - Microsoft and technical demo access / administrator approval</text></g><g id="colleague" transform="translate(35.0 110.0)"><rect width="220.0" height="90.0" fill="#F5F7FA" stroke="#8A97A6" rx="0" /><text x="12" y="25.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="bold">Microsoft / technical user</text><text x="12" y="44.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Corporate or sandbox account</text></g><g id="entra" transform="translate(335.0 110.0)"><rect width="220.0" height="90.0" fill="#F1F4FA" stroke="#17395C" rx="0" /><text x="12" y="25.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="bold">Microsoft Entra ID</text><text x="12" y="44.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Dedicated organizational app</text><text x="12" y="63.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Verified tenant allowlist</text></g><g id="frontend" transform="translate(635.0 110.0)"><rect width="220.0" height="90.0" fill="#EFFAF8" stroke="#13867C" rx="0" /><text x="12" y="25.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="bold">Next.js callback</text><text x="12" y="44.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">State / issuer / audience / nonce</text><text x="12" y="63.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Admin list / user approval</text></g><g id="api" transform="translate(935.0 110.0)"><rect width="220.0" height="90.0" fill="#EFFAF8" stroke="#13867C" rx="0" /><text x="12" y="25.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="bold">FastAPI access requests</text><text x="12" y="44.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Persist before email submission</text><text x="12" y="63.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Bounded send, no duplicate mail</text></g><g id="blob" transform="translate(1235.0 110.0)"><rect width="230.0" height="90.0" fill="#F1F4FA" stroke="#17395C" rx="0" /><text x="12" y="25.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="bold">Azure Blob Storage</text><text x="12" y="44.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Per-brand requests + notification</text><text x="12" y="63.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Cross-replica lease</text></g><g id="email" transform="translate(935.0 320.0)"><rect width="220.0" height="100.0" fill="#EFFAF8" stroke="#13867C" rx="0" /><text x="12" y="25.0" font-size="12.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="bold">Azure Communication Services</text><text x="12" y="43.0" font-size="12.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Request + approval email</text><text x="12" y="61.0" font-size="12.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Managed identity / Azure domain</text><text x="12" y="79.0" font-size="12.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Accepted != delivered</text></g><g id="admin" transform="translate(1235.0 320.0)"><rect width="230.0" height="100.0" fill="#F5F7FA" stroke="#8A97A6" rx="0" /><text x="12" y="25.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="bold">Administrator</text><text x="12" y="44.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Email + authenticated dashboard</text><text x="12" y="63.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Review / approve / refuse</text><text x="12" y="82.0" font-size="13.0" font-family="Arial, sans-serif" fill="#17395C" font-weight="normal">Requests survive email failures</text></g><g id="note" transform="translate(35.0 300.0)"><text x="12" y="25.0" font-size="14.0" font-family="Arial, sans-serif" fill="#4A5868" font-weight="normal">Entra/consent failures before callback cannot create a verified request.</text><text x="12" y="45.0" font-size="14.0" font-family="Arial, sans-serif" fill="#4A5868" font-weight="normal">Personal and unrelated tenant accounts are rejected.</text><text x="12" y="65.0" font-size="14.0" font-family="Arial, sans-serif" fill="#4A5868" font-weight="normal">Administration is explicitly allowlisted; approval grants user access only.</text><text x="12" y="85.0" font-size="14.0" font-family="Arial, sans-serif" fill="#4A5868" font-weight="normal">Approved applicant receives a login email; administrator is copied.</text><text x="12" y="105.0" font-size="14.0" font-family="Arial, sans-serif" fill="#4A5868" font-weight="normal">Manual email remains the fallback.</text></g><path d="M 255.0 155.0 L 335.0 155.0" fill="none" stroke="#17395C" stroke-width="2" /><polygon points="335.0,155.0 326.0,159.0 326.0,151.0" fill="#17395C" /><path d="M 555.0 155.0 L 635.0 155.0" fill="none" stroke="#17395C" stroke-width="2" /><polygon points="635.0,155.0 626.0,159.0 626.0,151.0" fill="#17395C" /><path d="M 855.0 155.0 L 935.0 155.0" fill="none" stroke="#17395C" stroke-width="2" /><polygon points="935.0,155.0 926.0,159.0 926.0,151.0" fill="#17395C" /><path d="M 1155.0 155.0 L 1235.0 155.0" fill="none" stroke="#17395C" stroke-width="2" /><polygon points="1235.0,155.0 1226.0,159.0 1226.0,151.0" fill="#17395C" /><path d="M 1045.0 200.0 L 1045.0 320.0" fill="none" stroke="#17395C" stroke-width="2" /><polygon points="1045.0,320.0 1041.0,311.0 1049.0,311.0" fill="#17395C" /><path d="M 1155.0 370.0 L 1235.0 370.0" fill="none" stroke="#17395C" stroke-width="2" /><polygon points="1235.0,370.0 1226.0,374.0 1226.0,366.0" fill="#17395C" /><path d="M 1292.5 200.0 L 1292.5 320.0" fill="none" stroke="#17395C" stroke-width="2" /><polygon points="1292.5,320.0 1288.5,311.0 1296.5,311.0" fill="#17395C" /><path d="M 1407.5 320.0 L 1407.5 200.0" fill="none" stroke="#17395C" stroke-width="2" /><polygon points="1407.5,200.0 1411.5,209.0 1403.5,209.0" fill="#17395C" /></svg>